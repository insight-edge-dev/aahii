name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a deploy that's already mid-flight on the VPS -
# queue the next run instead of interrupting a half-applied deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy aahii to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail

            cd /var/www/aahii

            echo "==> Pulling latest main"
            git fetch origin main
            git pull --ff-only origin main

            echo "==> Installing dependencies"
            npm ci

            echo "==> Generating Prisma client (migrations are NOT run here)"
            npx prisma generate

            echo "==> Building Next.js app"
            npm run build

            echo "==> Reloading PM2 process"
            pm2 reload aahii --update-env

            echo "==> Deployment complete"
